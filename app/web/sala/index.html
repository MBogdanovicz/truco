<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Truco! · Entrar na sala</title>
<!-- Invite links open the Android app when it is installed (App Links);
     everywhere else this page forwards to the PWA with the code filled in. -->
<script>
  var params = new URLSearchParams(location.search);
  var code = params.get('codigo') || '';
  // Game rooms add "jogo=1"; the beta site lives under /beta/.
  var base = location.pathname.replace(/sala\/?(index\.html)?$/, '');
  var screen = params.get('jogo') === '1' ? 'jogo/entrar' : 'marcador/entrar';
  location.replace(base + '#/' + screen + (code ? '?codigo=' + encodeURIComponent(code) : ''));
</script>
</head>
<body></body>
</html>
