<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="felt" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#2f8a57"/>
      <stop offset="1" stop-color="#0f4a2c"/>
    </radialGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".38"/>
    </filter>
    <g id="card">
      <rect x="-82" y="-118" width="164" height="236" rx="18" fill="#fffdf6"/>
      <rect x="-82" y="-118" width="164" height="236" rx="18" fill="none" stroke="#d9d2bf" stroke-width="3"/>
    </g>
  </defs>
  <g id="bg"><rect width="512" height="512" fill="url(#felt)"/></g>
  <g id="fg" font-family="Georgia, 'DejaVu Serif', serif" font-weight="700" text-anchor="middle">
    <g transform="translate(256 262)">
      <g transform="rotate(-22 0 190)" filter="url(#sh)">
        <use href="#card"/>
        <text x="-52" y="-72" font-size="44" fill="#c62828">7</text>
        <text x="-52" y="-34" font-size="36" fill="#c62828">♥</text>
        <text x="0" y="40" font-size="110" fill="#c62828">♥</text>
      </g>
      <g transform="translate(0 -6)" filter="url(#sh)">
        <use href="#card"/>
        <text x="-52" y="-72" font-size="44" fill="#1b1b1b">A</text>
        <text x="-52" y="-34" font-size="36" fill="#1b1b1b">♠</text>
        <text x="0" y="40" font-size="110" fill="#1b1b1b">♠</text>
      </g>
      <g transform="rotate(22 0 190)" filter="url(#sh)">
        <use href="#card"/>
        <text x="-52" y="-72" font-size="44" fill="#1b1b1b">4</text>
        <text x="-52" y="-34" font-size="36" fill="#1b1b1b">♣</text>
        <text x="0" y="40" font-size="110" fill="#1b1b1b">♣</text>
      </g>
    </g>
  </g>
</svg>
