name: Slow games

# Slow games ("partida lenta") give days per move. When someone runs out of
# time and nobody has the game open, this lets the computer move for them
# (game-sweep Edge Function) and pushes the next player.
on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Expire slow-game turns
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET not configured yet; skipping."
            exit 0
          fi
          curl --fail --silent --show-error -X POST \
            -H "x-cron-secret: $CRON_SECRET" \
            "$SUPABASE_URL/functions/v1/game-sweep"
