name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write  # publishes the test APK as the "android-latest" release

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build PWA
        run: flutter build web --release --no-web-resources-cdn --dart-define-from-file=config/supabase.json --dart-define=APP_COMMIT=${GITHUB_SHA::7}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Build Android APK
        run: flutter build apk --release --dart-define-from-file=config/supabase.json --dart-define=APP_COMMIT=${GITHUB_SHA::7}
      - uses: actions/upload-artifact@v7
        with:
          name: truco-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
      # The site links to this file for Android visitors (Env.androidApkUrl).
      - name: Publish the test APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk truco.apk
          gh release view android-latest >/dev/null 2>&1 || \
            gh release create android-latest --prerelease \
              --title "Android (teste)" \
              --notes "Versão de teste mais recente do app Android (atualizada a cada mudança)."
          gh release upload android-latest truco.apk --clobber
