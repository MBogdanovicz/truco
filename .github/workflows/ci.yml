name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # The web build is done (and deployed) by pwa.yml.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      # Caches Gradle and the Android plugins, so a hiccup on Google's Maven
      # (e.g. "Plugin com.android.application was not found") no longer
      # breaks the build.
      - uses: gradle/actions/setup-gradle@v5
      - name: Build Android APK
        # Retries once for network errors while downloading dependencies.
        run: |
          build() { flutter build apk --release --dart-define-from-file=config/supabase.json --dart-define=APP_COMMIT=${GITHUB_SHA::7}; }
          build || { echo "Retrying in 30 s"; sleep 30; build; }
      - uses: actions/upload-artifact@v7
        with:
          name: truco-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
