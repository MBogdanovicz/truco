name: Deploy PWA

# Publishes the web build to GitHub Pages at https://truco.mytrophies.app
# (custom domain set by app/web/CNAME):
#   /       the `main` branch (what testers use, released on purpose)
#   /beta/  the `dev` branch (work in progress, for Marcelo to try first)
# Pages hosts a single site, so every run builds both branches.
on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          path: main
      - uses: actions/checkout@v7
        with:
          ref: dev
          path: dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build main (site root)
        working-directory: main/app
        run: ../../dev/.github/scripts/build-pwa.sh / main
      - name: Build dev (/beta/)
        working-directory: dev/app
        run: ../.github/scripts/build-pwa.sh /beta/ dev
      - name: Assemble the site
        run: |
          mkdir -p site
          cp -r main/app/build/web/. site/
          mkdir -p site/.well-known
          cp main/app/web/.well-known/assetlinks.json site/.well-known/
          rm -rf site/beta
          cp -r dev/app/build/web site/beta
          # Only the root serves the domain and the App Links file.
          rm -rf site/beta/CNAME site/beta/.well-known
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # GitHub Pages sometimes stays in "syncing_files" past the 10 min
      # limit (the maximum); a second try usually goes through.
      - id: first
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - id: retry
        if: steps.first.outcome == 'failure'
        uses: actions/deploy-pages@v5
      - id: deployment
        run: echo "page_url=${{ steps.first.outputs.page_url || steps.retry.outputs.page_url }}" >> "$GITHUB_OUTPUT"
