name: Deploy PWA

# Publishes the web build to GitHub Pages at https://truco.mytrophies.app
# (custom domain set by app/web/CNAME).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --no-web-resources-cdn --dart-define-from-file=config/supabase.json
      - name: Version the entry scripts so browsers never mix cached builds
        working-directory: app/build/web
        run: |
          v="${GITHUB_SHA::8}"
          sed -i "s|\"flutter_bootstrap.js\"|\"flutter_bootstrap.js?v=$v\"|" index.html
          sed -i "s|\"main.dart.js\"|\"main.dart.js?v=$v\"|g" flutter_bootstrap.js
          grep -q "flutter_bootstrap.js?v=$v" index.html
          grep -q "main.dart.js?v=$v" flutter_bootstrap.js
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: app/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
